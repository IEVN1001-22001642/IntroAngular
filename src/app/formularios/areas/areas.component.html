<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col-6">
        <h1>Calcular área</h1>
        <form>
          <div class="form-check">
            <input [(ngModel)]="area" class="form-check-input"
            type="radio" name="area" value="tri" checked>
            <label class="form-check-label" for="tri">
              Triangulo
            </label>
          </div>
          <div class="form-check">
            <input [(ngModel)]="area" class="form-check-input"
            type="radio" name="area" value="circ">
            <label class="form-check-label" for="circ">
              Circulo
            </label>
          </div>
          <div class="form-check">
            <input [(ngModel)]="area" class="form-check-input"
            type="radio" name="area" value="rect">
            <label class="form-check-label" for="rect">
              Rectángulo
            </label>
          </div>
          <div class="form-check">
            <input [(ngModel)]="area" class="form-check-input"
            type="radio" name="area" value="penta">
            <label class="form-check-label" for="penta">
              Pentagono
            </label>
          </div>
          <br>
          <div class="form-group pt-4">
            <label for="num1">N1: </label>
            <input [(ngModel)]="num1" name="num1" type="text"
            class="form-control" id="num1" placeholder="Ingrese base"/>
          </div>
          <div class="form-group pt-4">
            <label for="num2">N2: </label>
            <input [(ngModel)]="num2" name="num2" type="text"
            class="form-control" id="num2" placeholder="Ingrese altura"/>
          </div>
          <br>
          <button (click)="calcArea()" type="button"
          class="btn btn-primary">
            Calcular área
          </button>
        </form>
      </div>
      <div class="col-6">
        <h2>Resultado: {{res}} </h2>
      </div>
    </div>
  </div>
</body>
</html>
