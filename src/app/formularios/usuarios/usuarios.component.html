<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col-6">
        <h1>Log in</h1>
        <form>
          <div class="form-group pt-4">
            <label for="usuario">Usuario: </label>
            <input [(ngModel)]="inputU" type="text" name="inputU" class="form-control" placeholder="Ingrese usuario">
          </div>
          <div class="form-group pt-4">
            <label for="contraseña">Contraseña: </label>
            <input [(ngModel)]="inputC" type="text" name="inputC" class="form-control" placeholder="Ingrese contraseña">
          </div>
          <br>
          <button (click)="logIn()" type="button" class="btn btn-primary">
            Ingresar
          </button>
          <br>
          <div>
            <h3>{{error}}</h3>
          </div>
        </form>
      </div>
      <div class="col-6">
        <h2 *ngIf="welcy">Bienvenido {{usuario}}</h2>
      </div>
    </div>
  </div>
</body>
</html>
