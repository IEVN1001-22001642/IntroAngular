<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col-6">
        <h1>Operaciones</h1>
        <form>
          <div class="form-group pt-4">
            <label for="num1">Número 1: </label>
            <input [(ngModel)]="num1" name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese número 1"/>
          </div>
          <div class="form-group pt-4">
            <label for="num2">Número 2: </label>
            <input [(ngModel)]="num2" name="num2" type="text" class="form-control" id="num2" placeholder="Ingrese número 2"/>
          </div>
          <br/>

          <div class="form-check">
            <input [(ngModel)]="operacion" class="form-check-input" type="radio" name="operacion" value="sum" checked>
            <label class="form-check-label" for="sum">
              Sumar
            </label>
          </div>
          <div class="form-check">
            <input [(ngModel)]="operacion" class="form-check-input" type="radio" name="operacion" value="rest">
            <label class="form-check-label" for="rest">
              Restar
            </label>
          </div>
          <div class="form-check">
            <input [(ngModel)]="operacion" class="form-check-input" type="radio" name="operacion" value="multi">
            <label class="form-check-label" for="multi">
              Multiplicar
            </label>
          </div>
          <div class="form-check">
            <input [(ngModel)]="operacion" class="form-check-input" type="radio" name="operacion" ="divid">
            <label class="form-check-label" for="divid">
              Dividir
            </label>
          </div>

          <button (click)="operar()" type="button" class="btn btn-primary">
            Sumar
          </button>
        </form>
      </div>
      <div class="col-6">
        <h2>Resultado: {{res}}</h2>
      </div>
    </div>
  </div>
</body>
</html>
